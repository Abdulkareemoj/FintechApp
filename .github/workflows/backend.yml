name: Backend Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "BankSystem/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "BankSystem/**"
  workflow_dispatch:

env:
  PROJECT_PATH: BankSystem/fintech-backend.csproj
  DOTNET_VERSION: "10.0.x"
  BUNDLE_RID: linux-x64
  AZURE_RESOURCE_GROUP: workstuff
  AZURE_WEBAPP_NAME: fintech-app
  AZURE_SQL_SERVER: fintechapp

jobs:
  build:
    name: Build, publish & migration bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o publish/app --no-build

      - name: Install EF tools (10.0.12, keep in sync with the EF Core package versions)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build self-contained migration bundle
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: >
          dotnet ef migrations bundle
          --self-contained -r ${{ env.BUNDLE_RID }}
          --configuration Release
          -o publish/efbundle
          --project ${{ env.PROJECT_PATH }}
          --startup-project ${{ env.PROJECT_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: publish

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Temporarily allow runner to reach Azure SQL
        id: sql-firewall
        shell: bash
        run: |
          runner_ip="$(curl -fsS https://api.ipify.org)"
          rule_name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "runner_ip=${runner_ip}" >> "$GITHUB_OUTPUT"
          echo "rule_name=${rule_name}" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER" \
            --name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

      - name: Apply database migrations
        env:
          ASPNETCORE_ENVIRONMENT: Production
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          # EF's bundle starts the API host to resolve AppDbContext. These
          # migration-only values satisfy startup; they are never deployed.
          Jwt__Key: migration-only-key-not-used-by-the-running-api
          Jwt__Issuer: migration
          Jwt__Audience: migration
        run: |
          if [ -z "$AZURE_SQL_CONNECTION_STRING" ]; then
            echo "::error::Set the AZURE_SQL_CONNECTION_STRING GitHub Actions secret."
            exit 1
          fi
          chmod +x publish/efbundle
          publish/efbundle --connection "$AZURE_SQL_CONNECTION_STRING"

      - name: Remove temporary Azure SQL firewall rule
        if: always() && steps.sql-firewall.outcome == 'success'
        run: |
          az sql server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER" \
            --name "${{ steps.sql-firewall.outputs.rule_name }}" \
            --output none

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish/app

      - name: Verify API health
        shell: bash
        run: |
          health_url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$health_url"; then
              echo "API is healthy."
              exit 0
            fi
            echo "Waiting for API health check (${attempt}/24)..."
            sleep 10
          done
          echo "::error::API did not become healthy at ${health_url}."
          exit 1
