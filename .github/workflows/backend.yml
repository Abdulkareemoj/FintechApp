name: Backend Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "BankSystem/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "BankSystem/**"

env:
  PROJECT_PATH: BankSystem/fintech-backend.csproj
  DOTNET_VERSION: "10.0.x"
  # x86_64 AMD micro instances → linux-x64 (this repo's Oracle box, confirmed
  # by "Exec format error" on an arm64 bundle). For Ampere A1 use linux-arm64.
  # Check with `uname -m`.
  BUNDLE_RID: linux-x64

jobs:
  build:
    name: Build, publish & migration bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish (framework-dependent)
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o publish --no-build

      - name: Install EF tools (10.0.12, keep in sync with the EF Core package versions)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build self-contained migration bundle
        env:
          # Production env keeps the dev-only auto-migrate/seed block out of the
          # design-time host; bundle creation needs no reachable database.
          ASPNETCORE_ENVIRONMENT: Production
        run: >
          dotnet ef migrations bundle
          --self-contained -r ${{ env.BUNDLE_RID }}
          --configuration Release
          -o publish/efbundle
          --project ${{ env.PROJECT_PATH }}
          --startup-project ${{ env.PROJECT_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to Oracle Cloud
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: publish

      - name: Package release
        run: |
          chmod +x publish/efbundle
          tar czf release-${GITHUB_SHA::7}.tar.gz -C publish .

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.ORACLE_CLOUD_IP }} >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_DIR=/home/${{ secrets.ORACLE_CLOUD_USER }}/fintech-backend
          ssh ${{ secrets.ORACLE_CLOUD_USER }}@${{ secrets.ORACLE_CLOUD_IP }} "mkdir -p ${BASE_DIR}/releases"
          scp release-${SHORT_SHA}.tar.gz ${{ secrets.ORACLE_CLOUD_USER }}@${{ secrets.ORACLE_CLOUD_IP }}:${BASE_DIR}/releases/${SHORT_SHA}.tar.gz

      - name: Apply migrations, symlink swap, restart
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_DIR=/home/${{ secrets.ORACLE_CLOUD_USER }}/fintech-backend
          RELEASE_DIR="${BASE_DIR}/releases/${SHORT_SHA}"
          ssh ${{ secrets.ORACLE_CLOUD_USER }}@${{ secrets.ORACLE_CLOUD_IP }} "
            set -e
            mkdir -p ${RELEASE_DIR} &&
            tar xzf ${RELEASE_DIR}.tar.gz -C ${RELEASE_DIR} &&
            rm ${RELEASE_DIR}.tar.gz &&
            chmod +x ${RELEASE_DIR}/efbundle &&
            . ${BASE_DIR}/shared/app.env &&
            ${RELEASE_DIR}/efbundle --connection \"\${ConnectionStrings__DefaultConnection}\" &&
            ln -sfn ${RELEASE_DIR} ${BASE_DIR}/live &&
            sudo systemctl restart fintech-backend
          "

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 http://${{ secrets.ORACLE_CLOUD_IP }}:5182/health > /dev/null 2>&1; then
              echo "API is healthy after deploy"
              exit 0
            fi
            echo "Waiting for API ($i/12)..."
            sleep 5
          done
          echo "API did not become healthy after deploy — check server logs (journalctl -u fintech-backend)"
          exit 1
